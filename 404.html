<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Still brewing | AI Kopi Daily</title><link rel="alternate" type="application/rss+xml" title="AI Kopi Daily" href="feed.xml"><link rel="icon" href="cover.jpg"><style>
:root{--bg:#fbf7f2;--card:#fff;--ink:#1f1a17;--muted:#7a6f66;--accent:#c2410c;--rule:#eadfd3}
@media (prefers-color-scheme:dark){:root{--bg:#1a1613;--card:#241e1a;--ink:#f3ebe3;
--muted:#b3a597;--accent:#fb923c;--rule:#3a312a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);
font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
main{max-width:680px;margin:0 auto;padding:28px 16px 48px}
a{color:var(--accent)}h1{font-size:28px;margin:0 0 4px;letter-spacing:-.3px}
.sub{color:var(--muted);margin:0 0 20px}.card{background:var(--card);border:1px solid var(--rule);
border-radius:14px;padding:18px;margin:16px 0}audio{width:100%;margin:10px 0 4px}
.date{color:var(--muted);font-size:14px}h2{font-size:19px;margin:0 0 4px}
ul{padding-left:20px}.t p{margin:6px 0}.t b{color:var(--accent)}
code{background:var(--rule);padding:2px 6px;border-radius:6px;font-size:14px;word-break:break-all}
.cover{width:96px;height:96px;border-radius:14px;float:right;margin:0 0 8px 12px}
li.ep{margin:8px 0}</style></head><body><main>
<h1>☕ Still brewing</h1>
<p class="sub" id="msg">Today's episode isn't out yet. It's usually ready by about 9:30am
Singapore time on weekdays; try this link again then.</p>
<div class="card" id="latest" hidden></div>
<p><a href="https://kxs7733.github.io/ai-kopi-podcast/">All episodes &rarr;</a></p>
<script>
fetch("https://kxs7733.github.io/ai-kopi-podcast/episodes.json").then(r => r.json()).then(eps => {
  if (!eps.length) return;
  const e = eps[0], box = document.getElementById("latest");
  box.innerHTML = '<div class="date">Meanwhile, the latest episode</div><h2><a href="https://kxs7733.github.io/ai-kopi-podcast/e/'
    + e.date + '.html"></a></h2><audio controls preload="none" src="https://kxs7733.github.io/ai-kopi-podcast/audio/' + e.date + '.mp3"></audio>';
  box.querySelector("a").textContent = e.title;
  box.hidden = false;
}).catch(() => {});
</script></main></body></html>
